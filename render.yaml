services:
  - type: web
    name: nisip-mis-demo
    runtime: static
    buildCommand: mkdir -p public/docs && cp index.html scheme.html projects.html reports.html map-analysis.html investment-calculator.html integrated-design.html signin.html home.css pages.css signin.css data.js calculator.js script.js public/ && cp docs/PROCESS-DESIGN.md docs/SYSTEM-ARCHITECTURE.md docs/BUSINESS-REQUIREMENTS.md docs/INTEGRATION-DESIGN.md public/docs/
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
